# GPT (Codex backend) WebSocket mode for the OpenAI channel.
# Leave endpoint/credential fields empty to inherit the DSH OpenAI provider.
# Explicit overrides require both an endpoint and credentials; no Codex CLI fallback.
- insert:
    - id: codex-ws
      name: 'dsh-codex-ws'
      config:
        # 'websocket' (WS 模式, openai 渠道原地拦截) | 'sse' (流式, 不拦截)
        # | 'auto' (WS 优先, 连接失败回退流式)
        transport: websocket

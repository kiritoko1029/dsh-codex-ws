name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'kiritoko1029/dsh-codex-ws' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install OIDC-capable npm
        run: npm install --global npm@11 --registry=https://registry.npmjs.org
      - name: Check release tag matches package version
        run: node --input-type=module -e 'import p from "./package.json" with { type:"json" }; if (process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("Tag/version mismatch")'
      # No dependencies or build step: the package ships plain JavaScript.
      - run: npm test
      - run: npm pack --dry-run
      - name: Publish with trusted publishing (OIDC)
        run: npm publish --access public --registry=https://registry.npmjs.org
